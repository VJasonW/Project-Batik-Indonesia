    <circle cx="0" cy="40" r="5" fill="none" stroke="#4a3728" stroke-width="1" opacity="0.2"/>
    <circle cx="40" cy="40" r="5" fill="none" stroke="#4a3728" stroke-width="1" opacity="0.2"/>
