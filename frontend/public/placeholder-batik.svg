    <circle cx="20" cy="20" r="8" fill="none" stroke="#4a3728" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#4a3728" stroke-width="1" opacity="0.2"/>
